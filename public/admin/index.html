<!doctype html>
<html lang="sr-Cyrl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Уређивач сајта — Природњачки музеј</title>
    <meta name="robots" content="noindex,nofollow" />

    <!-- Netlify Identity widget — handles editor login. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script>
      // We host the site on nhmbeo.aleksandarlukovic.com but the Identity
      // service lives on nhmbeo-site.netlify.app. The widget cannot infer
      // the endpoint from window.location, so initialise it explicitly
      // BEFORE Decap CMS loads (Decap reads window.netlifyIdentity).
      if (window.netlifyIdentity) {
        window.netlifyIdentity.init({
          APIUrl: 'https://nhmbeo-site.netlify.app/.netlify/identity',
        });
      }
    </script>
  </head>
  <body>
    <!-- Decap CMS bundle (open-source successor to Netlify CMS) -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // After invite-link signup, Netlify redirects back to the marketing
      // domain. Re-route the user back here so they enter the CMS, not the
      // homepage.
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (!user) {
            window.netlifyIdentity.on('login', () => {
              document.location.href = '/admin/';
            });
          }
        });
      }
    </script>
  </body>
</html>
