<!doctype html>
<html lang="sr-Cyrl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Уређивач сајта — Природњачки музеј</title>
    <meta name="robots" content="noindex,nofollow" />

    <!-- Cross-origin Identity: Identity service runs on nhmbeo-site.netlify.app
         while the site is hosted on nhmbeo.aleksandarlukovic.com. The widget
         needs an explicit API URL because it can't infer it from window.location. -->
    <meta name="netlify-identity-api-url" content="https://nhmbeo-site.netlify.app/.netlify/identity" />

    <!-- Netlify Identity widget — handles editor login. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Decap CMS bundle (open-source successor to Netlify CMS) -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // After invite-link signup, Netlify redirects back to the marketing
      // domain. Re-route the user back here so they enter the CMS, not the
      // homepage.
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (!user) {
            window.netlifyIdentity.on('login', () => {
              document.location.href = '/admin/';
            });
          }
        });
      }
    </script>
  </body>
</html>
