<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Природњачки музеј — Identity host</title>
    <meta name="robots" content="noindex,nofollow" />
  </head>
  <body>
    <script>
      // This subdomain (nhmbeo-site.netlify.app) hosts the CMS at /admin/
      // and the Netlify Identity service. Visitors who land here:
      //   • with an Identity URL fragment (#invite_token, #recovery_token,
      //     #confirmation_token, #email_change_token) → forward to /admin/
      //     SAME ORIGIN so the widget can read the token without cross-
      //     origin issues
      //   • everyone else → bounce to the public site on Hostinger.
      (function () {
        var hash = window.location.hash || '';
        if (/^#(invite_token|recovery_token|confirmation_token|email_change_token)=/.test(hash)) {
          window.location.replace('/admin/' + hash);
        } else {
          window.location.replace('https://nhmbeo.aleksandarlukovic.com/');
        }
      })();
    </script>
    <p>
      Open <a href="https://nhmbeo.aleksandarlukovic.com/">the museum site</a>.
    </p>
  </body>
</html>
