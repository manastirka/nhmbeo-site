# Netlify exists only to host the Identity service. The actual production
# deploy is the GitHub Action that FTPs to Hostinger. But Netlify won't make
# Identity reachable without a successful deploy of the connected repo, so
# we run the same static export here. Netlify becomes a free read-only
# backup of the site at https://nhmbeo-site.netlify.app — useful if Hostinger
# is ever down.

[build]
  command = """
    if [ -d src/app/api ]; then mv src/app/api /tmp/api-bak; fi;
    NEXT_OUTPUT=export npm run build;
    if [ -d /tmp/api-bak ]; then mv /tmp/api-bak src/app/api; fi
  """
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_OUTPUT = "export"

[build.processing]
  skip_processing = true
