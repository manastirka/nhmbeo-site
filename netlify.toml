# Netlify only hosts a tiny stub so the Identity service has a deploy
# attached and is reachable at /.netlify/identity. The real production
# build is the GitHub Action that FTPs to Hostinger.
#
# Putting `base` on a subdirectory with its own minimal package.json
# stops Netlify from auto-installing @netlify/plugin-nextjs (which would
# fight with our static export).

[build]
  base = "netlify-stub/"
  command = "true"
  publish = "."

[build.processing]
  skip_processing = true
